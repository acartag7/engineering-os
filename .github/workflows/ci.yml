name: ci

# engineering-os governs itself: the repo that defines the walls runs them on its
# own PRs. Required jobs: validate (public guard module syntax), acceptance (the
# process-guard frozen suite), process-guard (the artifact-chain action,
# dogfooded), and process-guard-trusted (the SAME guard materialized from the base
# ref so a tampered HEAD check.mjs cannot clear its own gate — PG-H8).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Public guard modules parse
        run: |
          set -euo pipefail
          for file in process-guard/scripts/*.mjs; do
            node --check "$file"
          done

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the process-guard frozen acceptance suite
        run: node --test test/acceptance/process-guard/guard.test.mjs

  process-guard:
    name: process-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}:refs/remotes/origin/${{ github.event.pull_request.base.ref || 'main' }}" || git fetch origin main
      - name: Run the artifact-chain guard on this repo
        uses: ./process-guard
        with:
          base-ref: origin/${{ github.event.pull_request.base.ref || 'main' }}
          # PG-H8: the guard gates its OWN code — a change under process-guard/scripts/
          # is a src change under stage-artifact / mixed-diff / freeze.
          src-paths: src/,process-guard/scripts/

  process-guard-trusted:
    name: process-guard-trusted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}:refs/remotes/origin/${{ github.event.pull_request.base.ref || 'main' }}" || git fetch origin main
      - name: Materialize the guard from the BASE ref (untrusted HEAD cannot self-pass)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pg-trusted"
          mkdir -p "$RUNNER_TEMP/pg-trusted"
          git archive "origin/${{ github.event.pull_request.base.ref || 'main' }}" process-guard/scripts | tar -x -C "$RUNNER_TEMP/pg-trusted"
      - name: Run the base-ref guard against the PR checkout
        env:
          PG_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          PG_SRC_PATHS: src/,process-guard/scripts/
          PG_ACCEPTANCE_DIR: test/acceptance
          PG_CONTRACT_PATHS: contracts.md,docs/contracts.md
        # cwd is the PR checkout, so the trusted guard evaluates HEAD; the check.mjs it
        # runs is the base ref's, not the PR's. NOTE (PG-H8 named residual): this job
        # definition still lives in the PR-controlled workflow; fully closing
        # workflow-definition tampering needs a repository ruleset-required workflow.
        run: node "$RUNNER_TEMP/pg-trusted/process-guard/scripts/check.mjs"
