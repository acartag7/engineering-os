name: ci

# engineering-os governs itself: the repo that defines the walls runs them on its
# own PRs. Required jobs: verify (the repository-owned full command), validate
# (plugin and prompt integrity), acceptance
# (process-policy contract, a real Go onboarding fixture, and the optional guard's
# frozen suite), process-guard (the optional action, dogfooded), and
# process-guard-trusted (the same guard materialized from the base ref).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: test/fixtures/go-project/go.mod
          cache: false
      - run: ./scripts/verify

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/engineering-os/.claude-plugin/plugin.json','utf8'))"

      - name: Agent and skill frontmatter present
        run: |
          set -euo pipefail
          for f in plugins/engineering-os/agents/*.md plugins/engineering-os/skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing YAML frontmatter"; exit 1; }
            grep -q '^name:' "$f"        || { echo "::error file=$f::missing name:"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::missing description:"; exit 1; }
          done
          echo "frontmatter ok for all agents + skills"

      - name: Vendored prompts match repo originals (drift guard)
        run: |
          set -euo pipefail
          for f in plugins/engineering-os/prompts/*.md; do
            base="$(basename "$f")"
            # line 1 is the vendored-source header; the rest must equal prompts/<base>
            if ! tail -n +2 "$f" | diff -q - "prompts/$base" >/dev/null; then
              echo "::error file=$f::vendored copy has drifted from prompts/$base — re-vendor"
              exit 1
            fi
          done
          echo "vendored prompts in sync with prompts/"

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: test/fixtures/go-project/go.mod
          cache: false
      - name: Check the current process contract
        run: node --test test/process-policy.test.mjs
      - name: Run the real Go onboarding fixture
        working-directory: test/fixtures/go-project
        run: ./scripts/verify
      - name: Run the process-guard frozen acceptance suite
        run: node --test test/acceptance/process-guard/guard.test.mjs

  process-guard:
    name: process-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}:refs/remotes/origin/${{ github.event.pull_request.base.ref || 'main' }}" || git fetch origin main
      - name: Run the artifact-chain guard on this repo
        uses: ./process-guard
        with:
          base-ref: origin/${{ github.event.pull_request.base.ref || 'main' }}
          # PG-H8: the guard gates its OWN code — a change under process-guard/scripts/
          # is a src change under stage-artifact / mixed-diff / freeze.
          src-paths: src/,process-guard/scripts/

  process-guard-trusted:
    name: process-guard-trusted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}:refs/remotes/origin/${{ github.event.pull_request.base.ref || 'main' }}" || git fetch origin main
      - name: Materialize the guard from the BASE ref (untrusted HEAD cannot self-pass)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pg-trusted"
          mkdir -p "$RUNNER_TEMP/pg-trusted"
          git archive "origin/${{ github.event.pull_request.base.ref || 'main' }}" process-guard/scripts | tar -x -C "$RUNNER_TEMP/pg-trusted"
      - name: Run the base-ref guard against the PR checkout
        env:
          PG_BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
          PG_SRC_PATHS: src/,process-guard/scripts/
          PG_ACCEPTANCE_DIR: test/acceptance
          PG_CONTRACT_PATHS: contracts.md,docs/contracts.md
        # cwd is the PR checkout, so the trusted guard evaluates HEAD; the check.mjs it
        # runs is the base ref's, not the PR's. NOTE (PG-H8 named residual): this job
        # definition still lives in the PR-controlled workflow; fully closing
        # workflow-definition tampering needs a repository ruleset-required workflow.
        run: node "$RUNNER_TEMP/pg-trusted/process-guard/scripts/check.mjs"
