<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Engineering OS workflow for one change</title>
  <desc id="desc">One owner scopes a change. The Basic, Standard, or Strict profile adds the needed contract, critique, and independent tests. One implementer builds the change. Repository verification and exact-head review produce evidence before the owner decides whether to merge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#101d35"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="work" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3154"/>
      <stop offset="1" stop-color="#15243f"/>
    </linearGradient>
    <linearGradient id="independent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16485a"/>
      <stop offset="1" stop-color="#123444"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b356a"/>
      <stop offset="1" stop-color="#30264e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#87a7d8"/>
    </marker>
    <style>
      .eyebrow { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #88a8d8; letter-spacing: 2.2px; }
      .title { font: 700 43px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f7f9ff; letter-spacing: -1px; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b8c7df; }
      .number { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #7dd3fc; letter-spacing: 1.2px; }
      .card-title { font: 700 23px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fbff; }
      .body { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #bdc9dc; }
      .small { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d7e0ee; }
      .profile { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fbff; }
      .profile-body { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #c2cede; }
      .band-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fbff; }
      .band-body { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #bdc9dc; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="30" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="145" fill="#7455aa" opacity="0.13"/>
  <circle cx="110" cy="900" r="180" fill="#15b8a6" opacity="0.09"/>

  <text x="76" y="70" class="eyebrow">ENGINEERING OS</text>
  <text x="76" y="124" class="title"><tspan>One change.</tspan><tspan dx="14">The right amount of safety.</tspan></text>
  <text x="76" y="162" class="subtitle">The profile adds independent checks. Every path keeps one implementation, repository verify, final review, and owner merge.</text>

  <g transform="translate(76 205)">
    <rect width="450" height="86" rx="18" fill="#17263f" stroke="#345076"/>
    <rect x="16" y="15" width="92" height="29" rx="14" fill="#29456d"/>
    <text x="62" y="35" text-anchor="middle" class="profile">Basic</text>
    <text x="126" y="34" class="profile-body">Smallest valid path for low-risk work</text>
    <text x="16" y="66" class="profile-body">Contract if unclear · owner review · CI only for T0</text>
  </g>
  <g transform="translate(575 205)">
    <rect width="450" height="86" rx="18" fill="#173747" stroke="#267085"/>
    <rect x="16" y="15" width="112" height="29" rx="14" fill="#236278"/>
    <text x="72" y="35" text-anchor="middle" class="profile">Standard</text>
    <text x="146" y="34" class="profile-body">Recommended normal default</text>
    <text x="16" y="66" class="profile-body">Closed contract · fresh critique · fresh review</text>
  </g>
  <g transform="translate(1074 205)">
    <rect width="450" height="86" rx="18" fill="#30294d" stroke="#715c9c"/>
    <rect x="16" y="15" width="92" height="29" rx="14" fill="#5a477e"/>
    <text x="62" y="35" text-anchor="middle" class="profile">Strict</text>
    <text x="126" y="34" class="profile-body">Required for T2 and T3</text>
    <text x="16" y="66" class="profile-body">Standard + independent tests proven failing first</text>
  </g>

  <text x="76" y="337" class="eyebrow">ONE REVIEWABLE SLICE</text>

  <g filter="url(#shadow)">
    <g transform="translate(76 366)">
      <rect width="330" height="156" rx="20" fill="url(#work)" stroke="#36547e" stroke-width="2"/>
      <text x="24" y="34" class="number">01 · OWNER</text>
      <text x="24" y="72" class="card-title">Scope one change</text>
      <text x="24" y="105" class="body">One rule, affected paths,</text>
      <text x="24" y="129" class="body">dependencies, and exclusions.</text>
    </g>
    <g transform="translate(451 366)">
      <rect width="330" height="156" rx="20" fill="url(#work)" stroke="#36547e" stroke-width="2"/>
      <text x="24" y="34" class="number">02 · WHEN REQUIRED</text>
      <text x="24" y="72" class="card-title">Contract + critique</text>
      <text x="24" y="105" class="body">Close decisions, then use fresh</text>
      <text x="24" y="129" class="body">judgment to find unsafe silence.</text>
    </g>
    <g transform="translate(826 366)">
      <rect width="330" height="156" rx="20" fill="url(#independent)" stroke="#2d7888" stroke-width="2"/>
      <text x="24" y="34" class="number" style="fill:#5eead4">03 · STRICT OR COVERAGE</text>
      <text x="24" y="72" class="card-title">Independent tests</text>
      <text x="24" y="105" class="body">Write small behavior tests and</text>
      <text x="24" y="129" class="body">prove they fail before the fix.</text>
    </g>
    <g transform="translate(1201 366)">
      <rect width="323" height="156" rx="20" fill="url(#work)" stroke="#36547e" stroke-width="2"/>
      <text x="24" y="34" class="number">04 · ONE IMPLEMENTATION</text>
      <text x="24" y="72" class="card-title">One implementer</text>
      <text x="24" y="105" class="body">Build the change and write its</text>
      <text x="24" y="129" class="body">normal tests together.</text>
    </g>
  </g>

  <path d="M406 444 H436" stroke="#87a7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M781 444 H811" stroke="#87a7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1156 444 H1186" stroke="#87a7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1362 522 V564 H241 V600" fill="none" stroke="#87a7d8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <g transform="translate(76 610)">
      <rect width="430" height="152" rx="20" fill="url(#wall)" stroke="#7762a5" stroke-width="2"/>
      <text x="24" y="34" class="number" style="fill:#d8b4fe">05 · HARD WHEN REQUIRED</text>
      <text x="24" y="72" class="card-title">Repository verify</text>
      <text x="24" y="105" class="body">Run real tests and the shipped entrypoint.</text>
      <text x="24" y="129" class="body">Required CI and branch protection hold the wall.</text>
    </g>
    <g transform="translate(585 610)">
      <rect width="430" height="152" rx="20" fill="url(#independent)" stroke="#2d7888" stroke-width="2"/>
      <text x="24" y="34" class="number" style="fill:#5eead4">06 · PROFILE PICKS THE REVIEWER</text>
      <text x="24" y="72" class="card-title">Exact-head review</text>
      <text x="24" y="105" class="body">Review the full change and record its SHA.</text>
      <text x="24" y="129" class="body">Any later push makes the review stale.</text>
    </g>
    <g transform="translate(1094 610)">
      <rect width="430" height="152" rx="20" fill="url(#work)" stroke="#4d6c98" stroke-width="2"/>
      <text x="24" y="34" class="number">07 · ONLY REQUIRED HUMAN</text>
      <text x="24" y="72" class="card-title">Owner merges</text>
      <text x="24" y="105" class="body">Checks and review provide evidence.</text>
      <text x="24" y="129" class="body">The owner makes the final decision.</text>
    </g>
  </g>

  <path d="M506 686 H570" stroke="#87a7d8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1015 686 H1079" stroke="#87a7d8" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(76 813)">
    <rect width="700" height="103" rx="20" fill="#111f34" stroke="#36547e"/>
    <text x="24" y="34" class="band-title">Independent roles fit the team you actually have</text>
    <text x="24" y="64" class="band-body">Named human · fresh AI session · multi-agent seat</text>
    <text x="24" y="86" class="small">No fake second human. No multi-agent requirement.</text>
  </g>
  <g transform="translate(824 813)">
    <rect width="700" height="103" rx="20" fill="#102f36" stroke="#287a78"/>
    <text x="24" y="34" class="band-title">Risk can raise the process, never lower it</text>
    <text x="24" y="64" class="band-body">T2 and T3 use Strict · Docs use at least Standard</text>
    <text x="24" y="86" class="small">Rules and roles are visible; the verify command belongs to the repo.</text>
  </g>
</svg>
