<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Engineering OS: shared T2 path with T3 escalation</title>
  <desc id="desc">T2 and T3 share contract, critique, separately authored acceptance tests, and a hash freeze. T2 continues with one implementation and different-family review. T3 escalates to two or three parallel implementations, frozen-suite scoring, blind two-family review, and stronger verification before required status checks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1022"/><stop offset="0.55" stop-color="#101936"/><stop offset="1" stop-color="#111b30"/></linearGradient>
    <linearGradient id="agentCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202d50"/><stop offset="1" stop-color="#17213d"/></linearGradient>
    <linearGradient id="evidenceCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123f4b"/><stop offset="1" stop-color="#102d3c"/></linearGradient>
    <linearGradient id="gateCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#413064"/><stop offset="1" stop-color="#272449"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/></filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#8aa4d6"/></marker>
    <marker id="loopArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#55d6be"/></marker>
    <style>
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f6f8ff; letter-spacing: -1px; }
      .subtitle { font: 400 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #aebddd; }
      .section { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #91a6ce; letter-spacing: 2px; }
      .step { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #7dd3fc; letter-spacing: 1px; }
      .cardTitle { font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f7f9ff; }
      .cardBody { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b9c5dc; }
      .smallTitle { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f7f9ff; }
      .smallBody { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b9c5dc; }
      .chip { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d5def3; letter-spacing: .4px; }
      .loopTitle { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b9fff0; }
      .loopBody { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a8d9d0; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="28" fill="url(#background)"/>
  <circle cx="1370" cy="85" r="130" fill="#5946a5" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="170" cy="920" r="150" fill="#0fbca4" opacity="0.11" filter="url(#softGlow)"/>

  <text x="80" y="78" class="section">ENGINEERING OS</text>
  <text x="80" y="132" class="title">From intent to independently enforced evidence</text>
  <text x="80" y="170" class="subtitle">Shared T2 controls, with explicit T3 candidate and review escalation.</text>
  <g transform="translate(1245 58)"><rect width="275" height="42" rx="21" fill="#182443" stroke="#344a75"/><circle cx="25" cy="21" r="6" fill="#55d6be"/><text x="43" y="27" class="chip">T2 CORE + T3 ESCALATION</text></g>
  <text x="80" y="230" class="section">SHARED T2 / T3 ARTIFACT CHAIN</text>

  <g filter="url(#shadow)">
    <g transform="translate(80 260)"><rect width="330" height="170" rx="20" fill="url(#agentCard)" stroke="#354a78" stroke-width="2"/><text x="26" y="35" class="step">01 · HUMAN-OWNED</text><text x="26" y="75" class="cardTitle">Contract</text><text x="26" y="108" class="cardBody">Fix the promises, boundaries,</text><text x="26" y="132" class="cardBody">and unresolved decisions first.</text><rect x="230" y="22" width="74" height="28" rx="14" fill="#26375f"/><text x="267" y="36" class="chip" text-anchor="middle" dominant-baseline="middle">INTENT</text></g>
    <g transform="translate(465 260)"><rect width="330" height="170" rx="20" fill="url(#agentCard)" stroke="#354a78" stroke-width="2"/><text x="26" y="35" class="step">02 · INDEPENDENT</text><text x="26" y="75" class="cardTitle">Critique</text><text x="26" y="108" class="cardBody">Attack silence, ambiguity,</text><text x="26" y="132" class="cardBody">and unsafe defaults before code.</text><rect x="223" y="22" width="81" height="28" rx="14" fill="#26375f"/><text x="263.5" y="36" class="chip" text-anchor="middle" dominant-baseline="middle">ATTACK</text></g>
    <g transform="translate(850 260)"><rect width="330" height="170" rx="20" fill="url(#evidenceCard)" stroke="#267485" stroke-width="2"/><text x="26" y="35" class="step" style="fill:#55d6be">03 · SEPARATE AUTHOR</text><text x="26" y="75" class="cardTitle">Acceptance</text><text x="26" y="108" class="cardBody">Encode “done” without seeing</text><text x="26" y="132" class="cardBody">or defending the implementation.</text></g>
    <g transform="translate(1235 260)"><rect width="285" height="170" rx="20" fill="url(#evidenceCard)" stroke="#267485" stroke-width="2"/><text x="26" y="35" class="step" style="fill:#55d6be">04 · HASH MANIFEST</text><text x="26" y="75" class="cardTitle">Freeze</text><text x="26" y="108" class="cardBody">Bind the test bytes.</text><text x="26" y="132" class="cardBody">Contract edit opens re-freeze.</text></g>
  </g>

  <path d="M410 345 H450" stroke="#8aa4d6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M795 345 H835" stroke="#8aa4d6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1180 345 H1220" stroke="#8aa4d6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1377 430 V475 H245 V510" stroke="#8aa4d6" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.85"/>

  <g filter="url(#shadow)">
    <g transform="translate(80 520)"><rect width="430" height="165" rx="20" fill="url(#agentCard)" stroke="#354a78" stroke-width="2"/><text x="26" y="35" class="step">05 · IMPLEMENTATION ROUTE</text><text x="26" y="75" class="cardTitle">Build candidates</text><text x="26" y="108" class="cardBody">T2 · one strong implementation</text><text x="26" y="132" class="cardBody">T3 · 2–3 parallel implementations</text></g>
    <g transform="translate(585 520)"><rect width="430" height="165" rx="20" fill="url(#agentCard)" stroke="#354a78" stroke-width="2"/><text x="26" y="35" class="step">06 · JUDGE &amp; REVIEW</text><text x="26" y="75" class="cardTitle">Select &amp; verify</text><text x="26" y="108" class="cardBody">T2 · different-family review</text><text x="26" y="132" class="cardBody">T3 · suite score + blind two-family rank</text></g>
    <g transform="translate(1090 520)"><rect width="430" height="165" rx="20" fill="url(#gateCard)" stroke="#7762b3" stroke-width="2"/><text x="26" y="35" class="step" style="fill:#c4b5fd">07 · REQUIRED STATUS CHECKS</text><text x="26" y="75" class="cardTitle">Gate &amp; merge</text><text x="26" y="108" class="cardBody">CI runs acceptance and tier-specific</text><text x="26" y="132" class="cardBody">verification; GitHub holds the merge wall.</text></g>
  </g>

  <path d="M510 602 H570" stroke="#8aa4d6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1015 602 H1075" stroke="#8aa4d6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(80 735)"><rect width="930" height="92" rx="18" fill="#111a31" stroke="#30456f" stroke-width="2"/><text x="26" y="34" class="smallTitle">Agent plane · produces work and evidence</text><text x="26" y="63" class="smallBody">Contract · critique · tests · implementation · review</text><rect x="740" y="25" width="164" height="38" rx="19" fill="#202d50"/><text x="822" y="44" class="chip" text-anchor="middle" dominant-baseline="middle">NO FINAL VERDICT</text></g>
  <g transform="translate(1040 735)"><rect width="480" height="92" rx="18" fill="#211d3c" stroke="#7762b3" stroke-width="2"/><text x="26" y="34" class="smallTitle">Enforcement plane · holds the walls</text><text x="26" y="63" class="smallBody">Git · process-guard · required CI · branch protection</text></g>

  <g transform="translate(80 864)"><rect width="1440" height="72" rx="36" fill="#0d2d31" stroke="#218878" stroke-width="2"/><circle cx="38" cy="36" r="21" fill="#15554f"/><path d="M29 36 l7 7 13-16" fill="none" stroke="#9effec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="31" class="loopTitle">The system learns from escape, not memory</text><text x="75" y="54" class="loopBody">defect or near-miss  →  sanitized lesson  →  guard / baseline / critique check  →  governed repositories</text><path d="M1368 36 H1405" stroke="#55d6be" stroke-width="3" fill="none" marker-end="url(#loopArrow)"/></g>
</svg>
